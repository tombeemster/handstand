<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#11131a">
<title>Handstand</title>
<link rel="stylesheet" href="style.css">

</head>
<body>

<section id="home">
  <h1>Handstand</h1>
  <div id="pb">Record <b id="best">–</b></div>
  <figure id="chart"></figure>
  <ul id="latest"></ul>
  <a id="more" href="#log">All attempts →</a>
</section>

<section id="record" hidden>
  <div id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <h1>Handstand</h1>
  <div id="status"></div>
  <pre id="debug"></pre>
  <div id="notice" hidden></div>
  <div id="controls">
    <div id="timer">0.00</div>
    <nav>
      <button id="camera" aria-label="Switch camera" hidden>⟲</button>
    </nav>
  </div>
</section>

<section id="log" hidden>
  <h1>Handstand</h1>
  <div id="days"></div>
  <button id="export">Export CSV</button>
</section>

<!-- Tab bar, on every screen: home, record, log -->
<nav id="tabs">
  <a href="#home" aria-label="Home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>
  </a>
  <a href="#record" aria-label="Record">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><circle class="dot" cx="12" cy="12" r="6"/></svg>
  </a>
  <a href="#log" aria-label="All attempts">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
  </a>
</nav>

<script type="module" src="app.js"></script>
</body>
</html>
