<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#11131a">
<title>Handstand</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Vend+Sans:ital,wght@0,300..700;1,300..700&display=swap" rel="stylesheet">

</head>
<body>

<section id="home">
  <h1>Handstand</h1>
  <div id="tiles">
    <div class="tile series-record">Record <b><span class="dot"></span><span id="best">–</span></b></div>
    <div class="tile series-avg">Average <b id="average">–</b></div>
  </div>
  <figure id="chart"></figure>
  <div id="latest"></div>
</section>

<section id="record" hidden>
  <div id="stage">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
  </div>
  <h1>Handstand</h1>
  <div id="status"></div>
  <pre id="debug"></pre>
  <div id="notice" hidden></div>
  <div id="controls">
    <div id="timer">0.00</div>
    <nav>
      <button id="camera" aria-label="Switch camera" hidden>⟲</button>
    </nav>
  </div>
</section>

<section id="log" hidden>
  <h1>Handstand</h1>
  <div id="days"></div>
  <button id="export">Export CSV</button>
</section>

<!-- Tab bar, on every screen: home, record, log. Icons: Lucide (user, video, logs), ISC licence, lucide.dev -->
<nav id="tabs">
  <a href="#home" aria-label="Home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
  </a>
  <a href="#record" aria-label="Record">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>
  </a>
  <a href="#log" aria-label="All attempts">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h1"/><path d="M3 12h1"/><path d="M3 19h1"/><path d="M8 5h1"/><path d="M8 12h1"/><path d="M8 19h1"/><path d="M13 5h8"/><path d="M13 12h8"/><path d="M13 19h8"/></svg>
  </a>
</nav>

<script type="module" src="app.js"></script>
</body>
</html>
